# tileserver-gl - melayani vector tile Bali ke app mobile.
#
# Penggunaan lokal (Docker):
#   docker compose up
#   # layani di http://localhost:8080
#
# Endpoint:
#   Style JSON:    http://localhost:8080/styles/bali/style.json
#   TileJSON:      http://localhost:8080/data/bali.json
#   Vector tiles:  http://localhost:8080/data/bali/{z}/{x}/{y}.pbf
#
# Catatan:
#   - Image tileserver-gl-light:v5.6.0 sudah punya HEALTHCHECK bawaan
#     (node + endpoint /health). docker ps otomatis menunjukkan 'healthy'.
#   - Config dan style di-mount read-only dari host. Container tidak
#     menulis ke folder manapun di host.

services:
  tileserver:
    image: maptiler/tileserver-gl-light:v5.6.0
    container_name: tileserver-gl
    restart: unless-stopped
    command: ["-c", "/etc/tileserver/config.json"]
    volumes:
      - ./config.json:/etc/tileserver/config.json:ro
      - ./styles:/etc/tileserver/styles:ro
      - ./data:/data:ro
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
